name: Current-definition annual-report availability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_annual_report_availability.py'
      - '.github/workflows/current-definition-annual-report-availability.yml'

concurrency:
  group: current-definition-annual-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - name: Audit latest PIT annual reports for all 50 constituents
        run: python scripts/current_definition_annual_report_availability.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-annual-report-availability
          path: data/current_definition_annual_report_availability.json
          if-no-files-found: error
