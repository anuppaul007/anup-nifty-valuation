name: Valuation lens redundancy audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model.js'
      - 'data/monthly_signal_screen.json'
      - 'scripts/valuation_redundancy_audit.py'
      - '.github/workflows/valuation-redundancy-audit.yml'

concurrency:
  group: valuation-redundancy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure current-definition valuation-lens redundancy
        run: python scripts/valuation_redundancy_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: valuation-redundancy-audit
          path: data/valuation_redundancy_audit.json
          if-no-files-found: error
