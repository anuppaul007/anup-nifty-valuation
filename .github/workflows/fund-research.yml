name: Long-run fund research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fund_strategy_rank.py"
      - "data/india_short_rate_proxy_1999_2006.csv"
      - ".github/workflows/fund-research.yml"

permissions:
  contents: write

concurrency:
  group: anup-nifty-fund-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calculate implementation return and survivor cohort rank
        run: python scripts/fund_strategy_rank.py
      - name: Commit research output
        run: |
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add -f data/fund_strategy_rank.json
          if git diff --cached --quiet; then
            echo "No research data change"
            exit 0
          fi
          git commit -m "data: refresh long-run fund research"
          git push
