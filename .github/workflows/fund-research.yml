name: Long-run fund research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anup-nifty-fund-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calculate implementation return and survivor cohort rank
        run: python scripts/fund_strategy_rank.py
      - name: Commit research output
        run: |
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add -f data/fund_strategy_rank.json
          if git diff --cached --quiet; then
            echo "No research data change"
            exit 0
          fi
          git commit -m "data: refresh long-run fund research"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because research data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
