name: Current-definition residual diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_integrated_probe.py'
      - '.github/workflows/current-definition-special-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/current_definition_integrated_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-integrated-probe
          path: data/current_definition_integrated_probe.json
          if-no-files-found: error
