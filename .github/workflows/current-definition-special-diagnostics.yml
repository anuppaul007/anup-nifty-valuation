name: Current-definition residual diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_integrated_probe.py'
      - 'scripts/current_definition_integrated_coverage.py'
      - 'scripts/current_definition_integrated_schema_probe.py'
      - 'scripts/current_definition_integrated_anchor.py'
      - '.github/workflows/current-definition-special-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - run: python scripts/current_definition_integrated_probe.py
      - run: python scripts/current_definition_integrated_coverage.py
      - run: python scripts/current_definition_integrated_schema_probe.py
      - run: python scripts/current_definition_integrated_anchor.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-integrated-anchor
          path: |
            data/current_definition_integrated_probe.json
            data/current_definition_integrated_coverage.json
            data/current_definition_integrated_schema_probe.json
            data/current_definition_integrated_anchor.json
          if-no-files-found: error
