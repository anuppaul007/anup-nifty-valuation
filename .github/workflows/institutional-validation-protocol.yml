name: Institutional validation protocol v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'INSTITUTIONAL_VALIDATION_PROTOCOL_v1.md'
      - 'institutional_validation_protocol_v1.json'
      - 'tests/test_institutional_validation_protocol_v1.py'
      - '.github/workflows/institutional-validation-protocol.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run protocol invariants
        run: python -m pytest -q tests/test_institutional_validation_protocol_v1.py
      - name: Enforce protocol freeze rules
        run: |
          python - <<'PY'
          import json
          p=json.load(open('institutional_validation_protocol_v1.json'))
          assert p['protocol_id'] == 'institutional-validation-protocol-v1'
          assert p['research_only'] is True
          assert p['live_authority'] == 'none'
          assert p['live_model_changed'] is False
          assert p['live_allocation_changed'] is False
          assert p['sample']['minimum_completed_months_for_validation_language_review'] == 120
          assert p['sample']['target_completed_months'] == 180
          assert p['costs']['primary_one_way_bps_on_traded_notional'] == 15
          assert p['primary_effect']['economic_materiality_min_pp_per_year'] == 0.8
          assert p['primary_effect']['familywise_one_sided_alpha_max'] == 0.05
          assert p['trial_family']['maximum_preregistered_variants_first_certified_panel_family'] == 6
          assert p['historical_pass_effect'] == 'confirmation_eligible_only'
          assert p['prospective_confirmation']['minimum_completed_months_before_promotion_review'] == 60
          assert p['overlays']['macro_live_authority_pp'] == 0
          assert p['automatic_parameter_changes'] is False
          print(json.dumps({
            'protocol_id':p['protocol_id'],
            'minimum_months':p['sample']['minimum_completed_months_for_validation_language_review'],
            'target_months':p['sample']['target_completed_months'],
            'economic_hurdle_pp_per_year':p['primary_effect']['economic_materiality_min_pp_per_year'],
            'family_cap':p['trial_family']['maximum_preregistered_variants_first_certified_panel_family'],
            'historical_pass_effect':p['historical_pass_effect'],
            'prospective_confirmation_months':p['prospective_confirmation']['minimum_completed_months_before_promotion_review'],
          },indent=2))
          PY
