name: Refresh valuation data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/evidence/**"
      - "data/evidence_status.json"
      - "data/health.json"
      - "data/latest.json"
      - "data/reliability_audit.json"
      - "data/calibration_stability_audit.json"
      - "data/walkforward_v3_13.json"
      - "data/multiasset.json"
      - "data/multiasset_backtest.json"
      - "data/walkforward.json"
      - "data/walkforward_v3_10.json"
      - "data/walkforward_v3_11.json"
      - "data/walkforward_v3_12.json"
      - "data/retrospective.json"
      - "data/robustness.json"
      - "data/robust_evaluation.json"
      - "data/benchmark_audit.json"
      - "data/macro_authority_audit.json"
      - "data/sma10_insurance_audit.json"
      - "data/sma10_episode_audit.json"
      - "data/backtest_monthly_2000.csv"
      - "data/backtest_monthly_2000.json"
      - "data/fund_strategy_rank.json"
  schedule:
    # 18:45 India time, Monday-Friday (GitHub cron is UTC)
    - cron: "15 13 * * 1-5"

concurrency:
  group: anup-nifty-valuation-data-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test data parsing and allocation safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.cjs
      - name: Refresh live valuation inputs
        run: python scripts/update_data_v3.py
      - name: Validate reproducible live reliability
        run: python scripts/reliability_audit.py
      - name: Quantify calibration fragility
        run: python scripts/calibration_stability_audit.py
      - name: Record prospective observation
        run: python scripts/walkforward.py
      - name: Commit only when data changed
        run: |
          paths=(data/latest.json data/reliability_audit.json data/calibration_stability_audit.json data/walkforward_v3_13.json)
          existing=()
          for p in "${paths[@]}"; do
            [[ -e "$p" ]] && existing+=("$p")
          done
          if (( ${#existing[@]} == 0 )); then
            echo "No generated paths exist"
            exit 1
          fi
          if git diff --quiet -- "${existing[@]}" && git status --porcelain -- "${existing[@]}" | grep -qv .; then
            echo "No data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add "${existing[@]}"
          git commit -m "data: refresh V3.13 valuation and shadow evidence"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because generated data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
