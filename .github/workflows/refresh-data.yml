name: Refresh valuation data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/evidence/**"
      - "data/evidence_status.json"
      - "data/health.json"
      - "data/latest.json"
      - "data/multiasset.json"
      - "data/multiasset_backtest.json"
      - "data/walkforward.json"
      - "data/walkforward_v3_10.json"
      - "data/walkforward_v3_11.json"
      - "data/retrospective.json"
      - "data/robustness.json"
      - "data/robust_evaluation.json"
      - "data/benchmark_audit.json"
      - "data/backtest_monthly_2000.csv"
      - "data/backtest_monthly_2000.json"
      - "data/fund_strategy_rank.json"
  schedule:
    # 18:45 India time, Monday-Friday (GitHub cron is UTC)
    - cron: "15 13 * * 1-5"

concurrency:
  group: anup-nifty-valuation-data-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data parsing and allocation safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.cjs
      - name: Refresh live valuation inputs
        run: python scripts/update_data_v3.py
      - name: Build snapshot-consistent multi-asset research
        run: python scripts/multiasset.py || true
      - name: Update prospective no-lookahead ledger
        run: python scripts/walkforward.py
      - name: Run valuation-core retrospective sensitivity
        run: python scripts/retrospective_core.py
      - name: Run independent robustness comparisons
        run: python scripts/robustness_audit.py
      - name: Run strict statistical evidence gate
        run: python scripts/robust_evaluation.py
      - name: Run investable timing benchmark audit
        run: python scripts/benchmark_audit.py
      - name: Generate Jan-2000 monthly valuation-core allocation table
        run: python scripts/backtest_monthly_2000.py
      - name: Research real-fund implementation and long-lived fund ranking
        run: python scripts/fund_strategy_rank.py
      - name: Commit only when data changed
        run: |
          paths=(
            data/latest.json
            data/multiasset.json
            data/walkforward.json
            data/walkforward_v3_10.json
            data/walkforward_v3_11.json
            data/retrospective.json
            data/robustness.json
            data/robust_evaluation.json
            data/benchmark_audit.json
            data/backtest_monthly_2000.csv
            data/backtest_monthly_2000.json
            data/fund_strategy_rank.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "No data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "data: refresh valuation studies and fund research"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because generated data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
