name: Refresh valuation data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/latest.json"
  schedule:
    # 18:45 India time, Monday-Friday (GitHub cron is UTC)
    - cron: "15 13 * * 1-5"

concurrency:
  group: anup-nifty-valuation-data-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data parsing and allocation safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/model.test.cjs
      - run: python scripts/update_data_v3.py
      - name: Commit only when data changed
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "data: refresh valuation inputs"
          git push
