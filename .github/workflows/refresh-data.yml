name: Refresh valuation data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/latest.json"
      - "data/multiasset.json"
      - "data/walkforward.json"
      - "data/retrospective.json"
      - "data/robustness.json"
      - "data/backtest_monthly_2000.csv"
      - "data/backtest_monthly_2000.json"
      - "data/fund_strategy_rank.json"
  schedule:
    # 18:45 India time, Monday-Friday (GitHub cron is UTC)
    - cron: "15 13 * * 1-5"

concurrency:
  group: anup-nifty-valuation-data-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data parsing and allocation safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/model.test.cjs
      - name: Refresh live valuation inputs
        run: python scripts/update_data_v3.py
      - name: Refresh experimental Gold Silver and BTC layer
        continue-on-error: true
        run: python scripts/multiasset.py
      - name: Update prospective no-lookahead ledger
        run: python scripts/walkforward.py
      - name: Run valuation-core retrospective sensitivity
        run: python scripts/retrospective_core.py
      - name: Run independent robustness comparisons
        run: python scripts/robustness_audit.py
      - name: Generate Jan-2000 monthly valuation-core allocation table
        run: python scripts/backtest_monthly_2000.py
      - name: Research real-fund implementation and long-lived fund ranking
        run: python scripts/fund_strategy_rank.py
      - name: Commit only when data changed
        run: |
          if git diff --quiet -- data/latest.json data/multiasset.json data/walkforward.json data/retrospective.json data/robustness.json data/backtest_monthly_2000.csv data/backtest_monthly_2000.json data/fund_strategy_rank.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add data/latest.json data/multiasset.json data/walkforward.json data/retrospective.json data/robustness.json data/backtest_monthly_2000.csv data/backtest_monthly_2000.json data/fund_strategy_rank.json
          git commit -m "data: refresh valuation studies and multi-asset research"
          git push