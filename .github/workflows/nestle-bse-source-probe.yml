name: Nestle BSE source probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/nestle_bse_source_probe.py'
      - '.github/workflows/nestle-bse-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe official BSE filing archive for Nestle India
        run: python scripts/nestle_bse_source_probe.py
      - name: Enforce diagnostic-only scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/nestle_bse_source_probe.json'))
          assert x['research_only'] is True
          assert x['live_authority'] == 'none'
          assert x['holdout_target_fetch_count'] == 0
          assert x['source']['scrip_code'] == '500790'
          assert x['row_count'] > 0
          print({'row_count':x['row_count'],'row_keys':x['row_keys'],'pages':x['pages']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nestle-bse-source-probe
          path: data/nestle_bse_source_probe.json
          if-no-files-found: error
