name: Current-definition validation pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_validation.py'
      - 'scripts/current_definition_anchor_validation.py'
      - '.github/workflows/current-definition-validation.yml'
      - 'tests/test_current_definition_validation.py'
      - 'CURRENT_DEFINITION_VALIDATION.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest pypdf pdfplumber
      - name: Unit tests
        run: pytest -q tests/test_current_definition_validation.py
      - name: Inspect official source schemas
        run: python scripts/current_definition_validation.py
      - name: Run all-50 anchor reconstruction
        run: python scripts/current_definition_anchor_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-validation
          path: |
            data/current_definition_validation.json
            data/current_definition_anchor_validation.json
          if-no-files-found: error
      - name: Headline
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/current_definition_anchor_validation.json'))
          print(json.dumps({'coverage':x['coverage'],'result':x['result'],'failed_constituents':x['failed_constituents'][:10],'live_model_changed':x['live_model_changed']},indent=2))
          PY
