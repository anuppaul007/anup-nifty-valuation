name: Current-definition validation pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_validation.py'
      - '.github/workflows/current-definition-validation.yml'
      - 'tests/test_current_definition_validation.py'
      - 'CURRENT_DEFINITION_VALIDATION.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest pypdf
      - name: Unit tests
        run: |
          if [ -f tests/test_current_definition_validation.py ]; then pytest -q tests/test_current_definition_validation.py; else echo 'pilot schema pass'; fi
      - name: Inspect official source schemas
        run: python scripts/current_definition_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-validation
          path: data/current_definition_validation.json
          if-no-files-found: error
      - name: Headline
        run: python -c "import json; x=json.load(open('data/current_definition_validation.json')); print(json.dumps({'weight_lines':x['weight_pdf']['line_count'],'financial_records':x['financials']['record_count'],'xbrl':x['xbrl']['status'],'action_records':x['corporate_actions']['record_count'],'live_model_changed':x['live_model_changed']},indent=2))"
