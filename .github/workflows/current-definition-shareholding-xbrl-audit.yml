name: Current-definition shareholding XBRL audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_shareholding_xbrl_audit.py'
      - '.github/workflows/current-definition-shareholding-xbrl-audit.yml'

concurrency:
  group: current-definition-shareholding-xbrl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - name: Compare official shareholding XBRL vs financial-result share count
        run: python scripts/current_definition_shareholding_xbrl_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-shareholding-xbrl-audit
          path: data/current_definition_shareholding_xbrl_audit.json
          if-no-files-found: error
