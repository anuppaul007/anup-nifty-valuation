name: Calibration stability audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model.js'
      - 'data/latest.json'
      - 'data/reliability_audit.json'
      - 'data/monthly_signal_screen.json'
      - 'scripts/calibration_stability_audit.py'
      - 'scripts/calibration_anchor_guard.py'
      - 'tests/test_calibration_missing_anchor.py'
      - 'tests/test_calibration_publication.py'
      - 'tests/test_calibration_reproduction.py'
      - 'tests/test_calibration_entrypoint.py'
      - 'tests/test_calibration_provenance.py'
      - 'CALIBRATION_REVIEW_NOTES_20261014.md'
      - '.github/workflows/calibration-stability-audit.yml'

concurrency:
  group: calibration-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Remove any stale audit artifact
        run: rm -f data/calibration_stability_audit.json
      - name: Execute synthetic-only anchor and publication regression tests
        run: python -m unittest discover -s tests -p 'test_calibration_*.py' -v
      - name: Quantify calibration fragility without return fitting
        run: python scripts/calibration_stability_audit.py
      - name: Enforce explicit fail-closed publication gate
        if: always()
        run: python scripts/calibration_stability_audit.py --verify-publication
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-stability-audit
          path: data/calibration_stability_audit.json
          if-no-files-found: error
