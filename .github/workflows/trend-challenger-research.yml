name: Trend challenger research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trend_policy_v1.json'
      - 'scripts/trend_source_probe.py'
      - 'scripts/trend_challenger_backtest.py'
      - 'scripts/trend_challenger_backtest_v2.py'
      - 'tests/test_trend_challenger.py'
      - '.github/workflows/trend-challenger-research.yml'
      - 'TREND_CHALLENGER_RESEARCH.md'

concurrency:
  group: trend-challenger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_trend_challenger.py
      - name: Probe frozen sleeve sources
        run: python scripts/trend_source_probe.py
      - name: Run historical challenger
        run: python scripts/trend_challenger_backtest_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-challenger-research
          path: |
            data/trend_source_probe.json
            data/trend_challenger_backtest.json
          if-no-files-found: error
