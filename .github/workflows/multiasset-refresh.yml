name: Refresh multi-asset research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh valuation data"]
    types: [completed]
  schedule:
    # Backup/weekend refresh. Weekday synchronized refreshes are chained from the core valuation workflow.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: anup-nifty-multiasset-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test multi-asset safeguards
        run: python -m unittest tests.test_multiasset -v
      - name: Build Gold Silver and BTC research layer
        run: python scripts/multiasset.py
      - name: Verify packet is live and synchronized to current core
        run: |
          python - <<'PY'
          import json
          latest = json.load(open('data/latest.json', encoding='utf-8'))
          packet = json.load(open('data/multiasset.json', encoding='utf-8'))
          assert packet.get('status') == 'live', packet.get('error') or 'multi-asset packet is not live'
          assert packet.get('source_latest_generated_at') == latest.get('generated_at'), (
              f"multi-asset/core snapshot mismatch: {packet.get('source_latest_generated_at')} != {latest.get('generated_at')}"
          )
          allocation = packet.get('core_allocation') or {}
          total = sum(float(allocation[k]) for k in ('equity_pct','debt_pct','gold_pct','silver_pct'))
          assert abs(total - 100.0) < 1e-8, f'core allocation total is {total}'
          print(json.dumps({
              'status': packet['status'],
              'source_latest_generated_at': packet['source_latest_generated_at'],
              'latest_generated_at': latest['generated_at'],
              'core_total_pct': total,
          }, indent=2))
          PY
      - name: Commit published multi-asset packet
        run: |
          if [ -z "$(git status --porcelain -- data/multiasset.json)" ]; then
            echo "No multi-asset data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add data/multiasset.json
          git commit -m "data: refresh Gold Silver and BTC research layer"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because multi-asset data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
