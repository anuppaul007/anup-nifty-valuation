name: Refresh multi-asset research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh valuation data"]
    types: [completed]
  schedule:
    # Backup/weekend refresh. Weekday synchronized refreshes are chained from the core valuation workflow.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: anup-nifty-multiasset-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test multi-asset safeguards
        run: python -m unittest tests.test_multiasset -v
      - name: Build Gold Silver and BTC research layer
        run: python scripts/multiasset.py || true
      - name: Commit published multi-asset packet
        run: |
          if [ -z "$(git status --porcelain -- data/multiasset.json)" ]; then
            echo "No multi-asset data change"
            exit 0
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add data/multiasset.json
          git commit -m "data: refresh Gold Silver and BTC research layer"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because multi-asset data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
