name: Development XBRL tag inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/development_xbrl_tag_inventory.py'
      - 'tests/test_development_xbrl_tag_inventory.py'
      - 'DEVELOPMENT_XBRL_TAG_INVENTORY.md'
      - '.github/workflows/development-xbrl-tag-inventory.yml'
      - 'scripts/development_accounting_source_map.py'
      - 'recent_reconstruction_policy_v1.json'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_development_xbrl_tag_inventory.py
      - name: Build two independent development XBRL retrieval sweeps
        run: |
          python scripts/development_xbrl_tag_inventory.py
          cp data/development_xbrl_tag_inventory.json /tmp/xbrl_sweep_a.json
          sleep 5
          python scripts/development_xbrl_tag_inventory.py
          cp data/development_xbrl_tag_inventory.json /tmp/xbrl_sweep_b.json
          python - <<'PY'
          import json, shutil
          a=json.load(open('/tmp/xbrl_sweep_a.json'))
          b=json.load(open('/tmp/xbrl_sweep_b.json'))
          best=a if a['xbrl_files_ok'] >= b['xbrl_files_ok'] else b
          best['retrieval_trials']=[
            {'trial':'A','xbrl_files_ok':a['xbrl_files_ok'],'xbrl_files_failed':a['xbrl_files_failed']},
            {'trial':'B','xbrl_files_ok':b['xbrl_files_ok'],'xbrl_files_failed':b['xbrl_files_failed']},
          ]
          best['retrieval_selection_rule']='Use the higher-coverage of two independent same-code sweeps only to reduce transient NSE archive/CDN availability noise. This does not change source eligibility, accounting semantics or any valuation target.'
          with open('data/development_xbrl_tag_inventory.json','w') as f:
              json.dump(best,f,indent=2,allow_nan=False); f.write('\n')
          print(json.dumps({'retrieval_trials':best['retrieval_trials'],'selected_ok':best['xbrl_files_ok']},indent=2))
          PY
      - name: Upload inventory ledger even when the evidence gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-xbrl-tag-inventory
          path: data/development_xbrl_tag_inventory.json
          if-no-files-found: error
      - name: Enforce discovery-only scope and broad archive coverage
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/development_xbrl_tag_inventory.json'))
          print(json.dumps({
            'retrieval_trials':x.get('retrieval_trials'),
            'selected_sources':x['selected_sources'],
            'template_family_counts':x['template_family_counts'],
            'xbrl_files_ok':x['xbrl_files_ok'],
            'xbrl_files_failed':x['xbrl_files_failed'],
            'failures':x['failures'],
          },indent=2))
          assert x['research_only'] is True
          assert x['live_authority'] == 'none'
          assert x['live_model_changed'] is False
          assert x['live_allocation_changed'] is False
          assert x['holdout_target_fetch_count'] == 0
          assert x['ratios_computed'] is False
          assert x['stage_b_summary']['development_months'] == 6
          assert x['stage_b_summary']['company_months_total'] == 300
          assert x['selected_sources'] >= 250
          assert x['xbrl_files_ok'] / x['selected_sources'] >= 0.98
          assert x['template_family_counts'].get('BANKING', 0) > 0
          assert x['template_family_counts'].get('INDAS', 0) > 0
          allowed_indus_periods={'2022-12-31','2023-03-31','2023-06-30'}
          for f in x['failures']:
              uses=f.get('uses',[])
              assert uses, f
              assert all(u.get('symbol') == 'INDUSINDBK' for u in uses), f
              assert all(u.get('period_end') in allowed_indus_periods for u in uses), f
          PY
