name: Development XBRL tag inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/development_xbrl_tag_inventory.py'
      - 'tests/test_development_xbrl_tag_inventory.py'
      - 'DEVELOPMENT_XBRL_TAG_INVENTORY.md'
      - '.github/workflows/development-xbrl-tag-inventory.yml'
      - 'scripts/development_accounting_source_map.py'
      - 'recent_reconstruction_policy_v1.json'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_development_xbrl_tag_inventory.py
      - name: Build development XBRL tag inventory
        run: python scripts/development_xbrl_tag_inventory.py
      - name: Enforce discovery-only scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/development_xbrl_tag_inventory.json'))
          assert x['research_only'] is True
          assert x['live_authority'] == 'none'
          assert x['live_model_changed'] is False
          assert x['live_allocation_changed'] is False
          assert x['holdout_target_fetch_count'] == 0
          assert x['ratios_computed'] is False
          assert x['stage_b_summary']['development_months'] == 6
          assert x['stage_b_summary']['company_months_total'] == 300
          assert x['selected_sources'] > 0
          assert x['xbrl_files_ok'] > 0
          print(json.dumps({
            'selected_sources': x['selected_sources'],
            'xbrl_files_ok': x['xbrl_files_ok'],
            'xbrl_files_failed': x['xbrl_files_failed'],
            'invalid_selected_links': len(x['invalid_selected_xbrl_links']),
            'stage_b_gap_symbols': x['stage_b_gap_symbols'],
            'candidate_name_counts': {k:len(v) for k,v in x['candidate_local_names'].items()},
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: development-xbrl-tag-inventory
          path: data/development_xbrl_tag_inventory.json
          if-no-files-found: error
