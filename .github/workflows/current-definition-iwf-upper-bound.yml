name: Current-definition IWF upper-bound audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_iwf_upper_bound_audit.py'
      - '.github/workflows/current-definition-iwf-upper-bound.yml'

concurrency:
  group: current-definition-iwf-upper-bound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - name: Run 50-stock IWF upper-bound audit
        run: python scripts/current_definition_iwf_upper_bound_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-iwf-upper-bound
          path: data/current_definition_iwf_upper_bound_audit.json
          if-no-files-found: error
