name: Multi-asset historical backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/multiasset_backtest.py"
      - ".github/workflows/multiasset-backtest.yml"
      - "data/backtest_monthly_2000.csv"
      - "data/india_short_rate_proxy_1999_2006.csv"
  schedule:
    - cron: "30 14 * * 6"

permissions:
  contents: write

concurrency:
  group: anup-nifty-multiasset-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run long-history multi-asset backtest
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "Backtest attempt ${attempt}/3"
            if python scripts/multiasset_backtest.py; then
              ok=1
              break
            fi
            sleep $((attempt * 8))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Backtest failed after three attempts"
            exit 1
          fi
      - name: Commit backtest result
        run: |
          if [ ! -f data/multiasset_backtest.json ]; then
            echo "Backtest output missing"
            exit 1
          fi
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add data/multiasset_backtest.json
          if git diff --cached --quiet; then
            echo "No backtest data change"
            exit 0
          fi
          git commit -m "data: refresh multi-asset historical backtest"
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Publish stopped because backtest data conflict with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Publish failed after three non-fast-forward retries"
          exit 1
