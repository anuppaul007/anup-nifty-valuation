name: Covariance valuation challenger

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model.js'
      - 'covariance_challenger.js'
      - 'covariance_challenger_policy.json'
      - 'tests/covariance_challenger.test.cjs'
      - '.github/workflows/covariance-challenger.yml'

concurrency:
  group: covariance-challenger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preregistration and fail-closed implementation
        run: node --test tests/covariance_challenger.test.cjs
