name: Current-definition all-50 shareholding basis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_all50_shareholding_basis.py'
      - '.github/workflows/current-definition-all50-shareholding-basis.yml'

concurrency:
  group: current-definition-all50-shareholding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - name: Recompute PE/PB using independent shareholding XBRL total shares
        run: python scripts/current_definition_all50_shareholding_basis.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-all50-shareholding-basis
          path: data/current_definition_all50_shareholding_basis.json
          if-no-files-found: error
