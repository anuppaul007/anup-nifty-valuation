name: Uncertainty and implementation audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/implementation_realism_audit.py'
      - 'tests/test_implementation_realism_audit.py'
      - 'implementation_realism_policy.json'
      - 'data/fund_strategy_rank.json'
      - 'uncertainty-ui.js'
      - 'evidence.js'
      - 'data/calibration_stability_audit.json'
      - '.github/workflows/implementation-realism-audit.yml'
      - '.github/workflows/research-refresh.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Unit-test implementation accounting
        run: python -m unittest tests.test_implementation_realism_audit -v
      - name: Generate research-only implementation audit
        run: python scripts/implementation_realism_audit.py
      - name: Validate browser disclosure syntax
        run: |
          node --check uncertainty-ui.js
          node --check evidence.js
      - name: Assert research modules cannot claim live authority
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/implementation_realism_audit.json'))
          c=json.load(open('data/calibration_stability_audit.json'))
          assert p['research_only'] is True
          assert p['live_model_changed'] is False
          assert p['live_allocation_changed'] is False
          assert p['unmodelled']['investor_tax_lots']
          assert len(p['cost_scenarios']) == 4
          assert c['research_only'] is True
          assert c['live_model_changed'] is False
          assert c['live_allocation_changed'] is False
          print('research-only guardrails passed')
          PY
