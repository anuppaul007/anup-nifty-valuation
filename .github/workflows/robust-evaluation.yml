name: Robust evaluation gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/robust_evaluation.py'
      - 'scripts/benchmark_audit.py'
      - 'scripts/update_data_v3.py'
      - 'tests/test_robust_evaluation.py'
      - 'tests/test_benchmark_audit.py'
      - 'tests/test_live_v311.py'
      - 'tests/model.test.cjs'
      - 'robust_evaluation_policy.json'
      - 'research_trial_registry.json'
      - 'validation_policy.json'
      - 'release_timing_policy.json'
      - 'data/retrospective.json'
      - 'data/robustness.json'
      - 'data/latest.json'
      - 'data/trend_challenger_summary.json'
      - 'model.js'
      - 'robustness.js'
      - 'app.js'
      - 'evidence-ui.js'
      - 'index.html'
      - 'AUDIT.md'
      - 'ROBUSTNESS_AUDIT.md'
      - 'MULTIASSET.md'
      - '.github/workflows/refresh-data.yml'
      - '.github/workflows/robust-evaluation.yml'

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Full data and model safeguards
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.cjs
      - name: Build robust evaluation
        run: python scripts/robust_evaluation.py
      - name: Build investable benchmark audit
        run: python scripts/benchmark_audit.py
      - name: Validate fail-closed output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/robust_evaluation.json')
          d=json.loads(p.read_text())
          assert d['schema_version'] == 2, d
          assert d['status']=='complete', d
          assert d['decision'] in {'NOT_ELIGIBLE_FOR_PROMOTION','ELIGIBLE_FOR_SEPARATE_PROMOTION_REVIEW'}
          assert 'gate_matrix' in d and 'multiple_testing_and_overfit' in d
          mt=d['multiple_testing_and_overfit']
          assert mt['trial_count']==24
          assert mt['return_series'].startswith('exposure-matched timing residual')
          assert mt['live_variant']['moment_source']=='selected exposure-matched timing-residual series'
          assert 'fair_null_and_timing' in d
          assert 'beta_matched_static_net' in d['fair_null_and_timing']
          assert 'placebo' in d['fair_null_and_timing']
          assert 'ar1_surrogate_null' in d and d['ar1_surrogate_null']['draws'] >= 1000
          assert 'ar1_surrogate_placebo_95th_percentile' in d['gate_matrix']
          assert d['governance']
          b=json.loads(Path('data/benchmark_audit.json').read_text())
          assert b['status']=='complete' and b['months']==63
          assert b['comparators']['ex_post_realised_mean_static']['available_ex_ante'] is False
          assert b['comparators']['fixed_60_40_policy']['available_ex_ante'] is True
          assert b['comparators']['expanding_mean_investable']['available_ex_ante'] is True
          assert b['observed_tradeoff_sentence'].startswith('Over the tested window, moving equity exposure added ')
          assert b['observed_effect_scale']['status']=='heuristic_only'
          print(json.dumps({'decision':d['decision'],'gates':d['gate_matrix'],'dsr':mt['live_variant'].get('probability'),'pbo':mt['cscv'].get('pbo'),'ar1':d['ar1_surrogate_null'].get('actual_excess_cagr_percentile'),'benchmark':b},separators=(',',':')))
          PY
      - name: Macro crash-guard candidate test
        run: node tests/macro_guard_candidate.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: robust-evaluation
          path: |
            data/robust_evaluation.json
            data/benchmark_audit.json
