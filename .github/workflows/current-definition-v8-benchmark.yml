name: Current-definition V8 benchmark gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/current_definition_v8_benchmark.py'
      - '.github/workflows/current-definition-v8-benchmark.yml'

concurrency:
  group: current-definition-v8-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify direct official P/E P/B DY benchmark
        run: python scripts/current_definition_v8_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-definition-v8-benchmark
          path: data/current_definition_v8_benchmark.json
          if-no-files-found: error
