name: Development source integrity research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/development_pit_source_integrity.py"
      - "development_manual_evidence/**"
      - "development_residual_source_policy_v1.json"
      - ".github/workflows/development-source-integrity.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/development_pit_source_integrity.py
