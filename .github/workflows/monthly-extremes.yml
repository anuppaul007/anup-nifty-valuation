name: Monthly valuation reconstruction 2000 onward
on:
  push:
    branches: [research/monthly-extremes]
    paths: [scripts/monthly_extremes.py, .github/workflows/monthly-extremes.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/monthly_extremes.py
      - name: Save research results
        run: |
          git config user.name "anup-nifty-bot"
          git config user.email "anup-nifty-bot@users.noreply.github.com"
          git add research/monthly_extremes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: first-of-month valuation reconstruction from 2000"
          git push
