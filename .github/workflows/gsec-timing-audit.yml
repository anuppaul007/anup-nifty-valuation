name: G-sec timing audit

on:
  pull_request:
    paths:
      - "scripts/gsec_timing_audit.py"
      - "tests/test_gsec_timing_audit.py"
      - "data/monthly_signal_screen.json"
      - "scripts/protocol_backtest.py"
      - ".github/workflows/gsec-timing-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsec-timing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_gsec_timing_audit.py
      - name: Run G-sec timing audit
        run: python scripts/gsec_timing_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: gsec-timing-audit
          path: data/gsec_timing_audit.json
          if-no-files-found: error
      - name: Show headline result
        run: python -c 'import json; x=json.load(open("data/gsec_timing_audit.json")); print(json.dumps({"safe":x["comparisons"]["rbi_timing_corrected_vs_incumbent"],"backtest":x["backtest"]}, indent=2))'
