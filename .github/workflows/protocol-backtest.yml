name: Protocol backtest research

on:
  pull_request:
    paths:
      - "scripts/protocol_backtest.py"
      - "tests/test_protocol_backtest.py"
      - "data/india_short_rate_proxy_1999_2006.csv"
      - "data/backtest_monthly_2000.csv"
      - ".github/workflows/protocol-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_protocol_backtest.py
      - name: Run exploratory protocol backtest
        run: python scripts/protocol_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-backtest
          path: data/protocol_backtest.json
          if-no-files-found: error
      - name: Show headline result
        run: python -c 'import json; x=json.load(open("data/protocol_backtest.json")); print(json.dumps(x["headline"], indent=2))'
