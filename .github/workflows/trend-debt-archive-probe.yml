name: Trend debt archive probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/trend_debt_archive_probe.py'
      - '.github/workflows/trend-debt-archive-probe.yml'

concurrency:
  group: trend-debt-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/trend_debt_archive_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-debt-archive-probe
          path: data/trend_debt_archive_probe.json
          if-no-files-found: error
